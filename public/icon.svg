<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>

  <!-- Phone Outline -->
  <rect x="146" y="86" width="220" height="340" rx="36" fill="#0F172A" stroke="#334155" stroke-width="12"/>
  
  <!-- Speaker notch -->
  <rect x="226" y="106" width="60" height="8" rx="4" fill="#64748B"/>

  <!-- Phone Screen -->
  <rect x="162" y="130" width="188" height="252" rx="20" fill="url(#screenGrad)"/>

  <!-- Screen Content: Box / Package Icon & Graph -->
  <!-- Box lid -->
  <path d="M256 180 L310 205 L256 230 L202 205 Z" fill="#FFFFFF" fill-opacity="0.95"/>
  <!-- Box left side -->
  <path d="M202 208 L252 232 L252 292 L202 268 Z" fill="#FFFFFF" fill-opacity="0.75"/>
  <!-- Box right side -->
  <path d="M260 232 L310 208 L310 268 L260 292 Z" fill="#FFFFFF" fill-opacity="0.88"/>

  <!-- Checkmark badge / growth spark -->
  <circle cx="316" cy="308" r="32" fill="#FFFFFF" stroke="#059669" stroke-width="4"/>
  <path d="M304 308 L312 316 L330 298" fill="none" stroke="#059669" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Home button bar -->
  <rect x="226" y="396" width="60" height="6" rx="3" fill="#64748B"/>
</svg>
